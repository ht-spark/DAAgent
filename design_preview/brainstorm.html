<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>头脑风暴 · RAG 对话 - MMAgent</title>
<link rel="stylesheet" href="assets/shared.css" />
<style>
  body { background:
    radial-gradient(ellipse 55% 40% at 100% 0%, rgba(167,139,250,0.10), transparent 60%),
    radial-gradient(ellipse 45% 35% at 0% 100%, rgba(34,211,238,0.06), transparent 60%),
    var(--bg);
  }
  .app {
    display: grid;
    grid-template-columns: 252px 1fr 320px;
    height: 100vh;
    padding-top: 68px;
  }
  /* ============ 左侧知识库 ============ */
  .kb-side {
    border-right: 1px solid var(--border);
    background: rgba(10,14,26,0.6);
    backdrop-filter: blur(10px);
    overflow-y: auto;
    padding: 22px 16px;
  }
  .kb-side h4 {
    font-size: 11.5px; letter-spacing: 3px; color: var(--muted);
    margin: 4px 8px 14px; font-weight: 600;
  }
  .kb-item {
    display: flex; align-items: center; gap: 11px;
    padding: 12px 13px; border-radius: 13px;
    cursor: pointer; transition: all 0.25s;
    border: 1px solid transparent;
    margin-bottom: 5px;
  }
  .kb-item:hover { background: rgba(255,255,255,0.04); }
  .kb-item.sel {
    background: linear-gradient(90deg, rgba(108,124,255,0.14), rgba(108,124,255,0.03));
    border-color: rgba(108,124,255,0.35);
  }
  .kb-ic {
    width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 17px;
    background: linear-gradient(135deg, rgba(108,124,255,0.25), rgba(34,211,238,0.15));
    border: 1px solid rgba(108,124,255,0.3);
  }
  .kb-meta { min-width: 0; }
  .kb-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kb-sub { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; align-items: center; gap: 6px; }
  .st-dot { width: 6px; height: 6px; border-radius: 50%; }
  .st-dot.on { background: var(--success); box-shadow: 0 0 7px var(--success); }
  .st-dot.busy { background: var(--warning); box-shadow: 0 0 7px var(--warning); animation: blink 1.2s infinite; }

  .new-kb {
    margin-top: 14px; width: 100%;
    padding: 12px; border-radius: 12px;
    border: 1.5px dashed rgba(108,124,255,0.45);
    background: rgba(108,124,255,0.05);
    color: #aab6ff; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.25s; font-family: var(--font);
  }
  .new-kb:hover { background: rgba(108,124,255,0.12); transform: translateY(-1px); }

  /* ============ 中间对话 ============ */
  .chat-col { display: flex; flex-direction: column; min-width: 0; }
  .chat-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 17px 26px; border-bottom: 1px solid var(--border);
    background: rgba(10,14,26,0.5); backdrop-filter: blur(10px);
  }
  .chat-head .ttl { font-weight: 700; font-size: 15.5px; display: flex; align-items: center; gap: 10px; }
  .mode-chip {
    font-size: 11px; font-weight: 700; letter-spacing: 1px;
    padding: 4px 10px; border-radius: 7px;
    background: rgba(34,211,238,0.1); color: #8ae9f7;
    border: 1px solid rgba(34,211,238,0.3);
  }
  .msgs { flex: 1; overflow-y: auto; padding: 28px clamp(18px, 4vw, 48px); scroll-behavior: smooth; }

  .msg { display: flex; gap: 15px; margin-bottom: 30px; animation: msgIn 0.5s cubic-bezier(0.22,0.68,0.36,1); }
  @keyframes msgIn { from { opacity: 0; transform: translateY(16px); } }
  .avatar {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 19px;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .avatar {
    background: linear-gradient(135deg, #33406e, #232c50);
    border: 1px solid rgba(255,255,255,0.14);
  }
  .msg.ai .avatar {
    background: var(--grad-v);
    box-shadow: 0 4px 20px rgba(108,124,255,0.45);
    animation: floaty 3.2s ease-in-out infinite;
  }
  @keyframes floaty { 50% { transform: translateY(-3px); } }
  .bubble {
    max-width: 76%;
    padding: 16px 20px;
    border-radius: 18px;
    font-size: 14.5px; line-height: 1.85;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, #2a3560, #232b52);
    border: 1px solid rgba(255,255,255,0.1);
    border-top-right-radius: 6px;
  }
  .msg.ai .bubble {
    background: var(--card);
    border: 1px solid var(--border);
    border-top-left-radius: 6px;
    backdrop-filter: blur(8px);
  }
  .bubble b { color: #aab6ff; }
  .cite {
    display: inline-flex; align-items: center;
    vertical-align: super;
    font-size: 10.5px; font-weight: 800;
    width: 17px; height: 17px;
    margin: 0 2px;
    border-radius: 6px;
    justify-content: center;
    cursor: pointer;
    color: #8ae9f7; background: rgba(34,211,238,0.12);
    border: 1px solid rgba(34,211,238,0.35);
    transition: all 0.2s;
  }
  .cite:hover, .cite.lit {
    background: var(--cyan); color: #05141a;
    box-shadow: 0 0 12px rgba(34,211,238,0.6);
    transform: translateY(-1px);
  }
  .cite-card {
    margin-top: 13px; padding-top: 13px;
    border-top: 1px dashed rgba(255,255,255,0.1);
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .src-chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12px; color: var(--text-dim);
    padding: 6px 12px; border-radius: 9px;
    background: rgba(255,255,255,0.03); border: 1px solid var(--border);
    cursor: pointer; transition: all 0.2s;
  }
  .src-chip:hover { border-color: rgba(34,211,238,0.45); color: var(--text); transform: translateY(-1px); }
  .src-chip i { width: 6px; height: 6px; border-radius: 2px; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }

  /* 输入区 */
  .input-bar { padding: 18px clamp(18px, 4vw, 48px) 24px; }
  .input-shell {
    display: flex; align-items: flex-end; gap: 12px;
    padding: 14px 16px 14px 20px;
    border-radius: 20px;
    background: rgba(16,22,40,0.85);
    border: 1px solid var(--border-strong);
    transition: all 0.3s;
    position: relative;
  }
  .input-shell:focus-within {
    border-color: rgba(108,124,255,0.65);
    box-shadow: 0 0 0 4px rgba(108,124,255,0.12), 0 8px 34px rgba(108,124,255,0.18);
  }
  .input-shell textarea {
    flex: 1; resize: none; outline: none; border: none;
    background: transparent; color: var(--text);
    font-family: var(--font); font-size: 14.5px; line-height: 1.6;
    max-height: 120px;
  }
  .send-btn {
    width: 44px; height: 44px; border-radius: 14px;
    border: none; cursor: pointer; flex-shrink: 0;
    background: var(--grad); color: #fff; font-size: 18px;
    box-shadow: 0 4px 18px rgba(108,124,255,0.45);
    transition: all 0.25s;
  }
  .send-btn:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 7px 26px rgba(108,124,255,0.6); }
  .input-tips { display: flex; gap: 9px; margin-top: 13px; flex-wrap: wrap; }
  .tip {
    font-size: 12px; color: var(--muted);
    padding: 6px 13px; border-radius: 100px;
    border: 1px solid var(--border);
    cursor: pointer; transition: all 0.2s;
  }
  .tip:hover { color: #aab6ff; border-color: rgba(108,124,255,0.45); background: rgba(108,124,255,0.07); }

  /* 流式光标 */
  .stream-caret::after {
    content: "▍";
    color: var(--cyan);
    animation: blink 0.8s steps(1) infinite;
  }

  /* ============ 右侧检索面板 ============ */
  .ctx-side {
    border-left: 1px solid var(--border);
    background: rgba(10,14,26,0.6);
    backdrop-filter: blur(10px);
    overflow-y: auto;
    padding: 22px 18px;
  }
  .ctx-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .ctx-head h4 { font-size: 13px; letter-spacing: 2px; color: var(--text-dim); }
  .rrf-badge {
    font-family: var(--mono); font-size: 10.5px;
    color: #8ae9f7; background: rgba(34,211,238,0.08);
    border: 1px solid rgba(34,211,238,0.3);
    padding: 3px 9px; border-radius: 7px;
  }
  .chunk {
    margin-top: 14px;
    padding: 15px 16px;
    border-radius: 14px;
    background: var(--card);
    border: 1px solid var(--border);
    cursor: pointer;
    opacity: 0; transform: translateY(12px);
    animation: chunkIn 0.5s forwards;
    transition: all 0.25s;
  }
  @keyframes chunkIn { to { opacity: 1; transform: none; } }
  .chunk:hover { border-color: rgba(108,124,255,0.45); transform: translateY(-2px); }
  .chunk.lit {
    border-color: rgba(34,211,238,0.55);
    box-shadow: 0 0 24px rgba(34,211,238,0.12);
    background: rgba(34,211,238,0.05);
  }
  .chunk-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
  .chunk-src { font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 7px; min-width: 0; }
  .chunk-src span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chunk-no {
    width: 19px; height: 19px; border-radius: 6px; flex-shrink: 0;
    display: grid; place-items: center;
    font-size: 10.5px; font-weight: 800;
    background: rgba(108,124,255,0.18); color: #aab6ff;
    border: 1px solid rgba(108,124,255,0.35);
  }
  .chunk-txt {
    font-size: 12.3px; line-height: 1.75; color: var(--text-dim);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .chunk-txt mark {
    background: rgba(34,211,238,0.18); color: #aef0fa;
    border-radius: 4px; padding: 0 3px;
  }
  .score-row { display: flex; align-items: center; gap: 9px; margin-top: 11px; }
  .score-bar { flex: 1; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.07); overflow: hidden; }
  .score-fill {
    height: 100%; border-radius: 3px;
    background: var(--grad);
    width: 0;
    transition: width 1.1s cubic-bezier(0.22,0.68,0.36,1);
    box-shadow: 0 0 8px rgba(108,124,255,0.5);
  }
  .score-num { font-family: var(--mono); font-size: 11px; color: #8ae9f7; }
  .route-tags { display: flex; gap: 5px; margin-top: 9px; }
  .rt {
    font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
    padding: 2.5px 8px; border-radius: 6px;
  }
  .rt.dense { color: #b3bdff; background: rgba(108,124,255,0.12); border: 1px solid rgba(108,124,255,0.3); }
  .rt.bm25 { color: #fbd38d; background: rgba(251,191,36,0.08); border: 1px solid rgba(251,191,36,0.28); }

  @media (max-width: 1180px) {
    .app { grid-template-columns: 220px 1fr; }
    .ctx-side { display: none; }
  }
  @media (max-width: 780px) {
    .app { grid-template-columns: 1fr; }
    .kb-side { display: none; }
  }
</style>
<link rel="stylesheet" href="assets/warm.css" />
</head>
<body>

<nav class="nav">
  <a class="nav-logo" href="index.html">
    <span class="mark">∑</span>
    <span class="word"><div class="name">MMAgent</div><div class="sub">数学建模智能体平台</div></span>
  </a>
  <div class="nav-links">
    <a href="index.html">首页</a>
    <a href="task.html">建模任务</a>
    <a class="active" href="brainstorm.html">头脑风暴</a>
    <a href="dashboard.html">数据看板</a>
    <a class="nav-cta" href="#ask">继续提问 →</a>
  </div>
</nav>

<div class="app">

  <!-- ================= 左：知识库 ================= -->
  <aside class="kb-side">
    <h4>知识库</h4>
    <div class="kb-item sel">
      <span class="kb-ic">📚</span>
      <div class="kb-meta">
        <div class="kb-name">数模方法库 v3</div>
        <div class="kb-sub"><i class="st-dot on"></i>128 文档 · 52,340 切片</div>
      </div>
    </div>
    <div class="kb-item">
      <span class="kb-ic">🏆</span>
      <div class="kb-meta">
        <div class="kb-name">国赛优秀论文集</div>
        <div class="kb-sub"><i class="st-dot on"></i>64 文档 · 21,082 切片</div>
      </div>
    </div>
    <div class="kb-item">
      <span class="kb-ic">🌾</span>
      <div class="kb-meta">
        <div class="kb-name">农业种植专题</div>
        <div class="kb-sub"><i class="st-dot busy"></i>向量化中 78%</div>
      </div>
    </div>
    <button class="new-kb">＋ 新建知识库</button>
  </aside>

  <!-- ================= 中：对话 ================= -->
  <section class="chat-col">
    <header class="chat-head">
      <div class="ttl">💡 头脑风暴 <span class="mode-chip">RAG · 混合检索 Top5</span></div>
      <div style="display:flex;gap:10px;">
        <button class="opbtn sub" style="padding:8px 16px;">⟳ 新话题</button>
        <button class="opbtn main" style="padding:8px 16px;">⚡ 加载思路到建模任务</button>
      </div>
    </header>

    <div class="msgs" id="msgs">

      <!-- 用户消息 -->
      <div class="msg user">
        <div class="avatar">🧑‍🔬</div>
        <div class="bubble">
          我在做农作物种植策略优化题，涉及不确定天气下的多目标决策。
          应该用什么模型组合？怎么处理降雨的不确定性？
        </div>
      </div>

      <!-- AI 消息（JS 流式渲染） -->
      <div class="msg ai">
        <div class="avatar">∑</div>
        <div class="bubble" id="aiBubble">
          <span id="aiText" class="stream-caret"></span>
        </div>
      </div>
    </div>

    <div class="input-bar" id="ask">
      <div class="input-shell">
        <textarea rows="1" placeholder="向读过整个知识库的 AI 提问，例如：这道题适合用随机规划还是鲁棒优化？"></textarea>
        <button class="send-btn">➤</button>
      </div>
      <div class="input-tips">
        <span class="tip">🎯 推荐建模方法</span>
        <span class="tip">📉 如何做灵敏度分析</span>
        <span class="tip">📐 论文结构怎么搭</span>
        <span class="tip">🔍 检索相关优秀论文</span>
      </div>
    </div>
  </section>

  <!-- ================= 右：检索命中 ================= -->
  <aside class="ctx-side">
    <div class="ctx-head">
      <h4>◈ 本轮检索命中</h4>
      <span class="rrf-badge">RRF fused</span>
    </div>
    <div id="chunks"></div>
  </aside>
</div>

<script>
/* ============================================================
   右侧检索片段
   ============================================================ */
const CHUNKS = [
  {
    src: "运筹学_第5章_随机规划.pdf", no: "1", score: 0.92,
    tags: ["dense","bm25"],
    text: "对于降雨量等环境不确定性，可采用<mark>蒙特卡洛模拟</mark>生成场景集，结合两阶段随机规划求解：第一阶段确定种植面积，第二阶段根据实现 rainfall 调整…",
  },
  {
    src: "国赛优秀论文_C题_种植策略.md", no: "2", score: 0.87,
    tags: ["dense"],
    text: "本文以<mark>期望收益最大</mark>与<mark>风险 CVaR 最小</mark>构成双目标，采用 ε-约束法将多目标转化为单目标族，帕累托前沿显示…",
  },
  {
    src: "统计方法手册_贝叶斯估计.md", no: "3", score: 0.81,
    tags: ["bm25"],
    text: "当历史样本较少时，建议用<mark>贝叶斯共轭先验</mark>(Beta/Dirichlet) 估计各作物存活率，避免极大似然在小样本下的过拟合…",
  },
  {
    src: "线性规划与对偶理论.docx→md", no: "4", score: 0.74,
    tags: ["bm25"],
    text: "<mark>影子价格</mark>可解释土地/水资源约束的边际价值，用于灵敏度分析章节的经济学讨论，是论文加分项…",
  },
];
const chunksEl = document.getElementById("chunks");
chunksEl.innerHTML = CHUNKS.map((c, i) => `
  <div class="chunk" data-no="${c.no}" style="animation-delay:${0.4 + i * 0.18}s">
    <div class="chunk-top">
      <span class="chunk-src"><span class="chunk-no">${c.no}</span><span>${c.src}</span></span>
    </div>
    <div class="chunk-txt">${c.text}</div>
    <div class="score-row">
      <div class="score-bar"><div class="score-fill" data-score="${c.score}"></div></div>
      <span class="score-num">${c.score.toFixed(2)}</span>
    </div>
    <div class="route-tags">
      ${c.tags.includes("dense") ? '<span class="rt dense">BGE 稠密</span>' : ""}
      ${c.tags.includes("bm25") ? '<span class="rt bm25">BM25 稀疏</span>' : ""}
    </div>
  </div>`).join("");

// 分数条动画
setTimeout(() => {
  document.querySelectorAll(".score-fill").forEach(f => {
    f.style.width = (parseFloat(f.dataset.score) * 100) + "%";
  });
}, 300);

/* ============================================================
   AI 回答流式输出（带引用角标）
   ============================================================ */
const ANSWER = [
  { t: "推荐使用「两阶段随机规划 + 蒙特卡洛场景生成」的组合框架：" , cites: [1] },
  { t: "\n\n① 场景层：用历史降雨频率构造 Beta 分布，蒙特卡洛采样 N=10⁴ 生成场景集" , cites: [1] },
  { t: "\n\n② 决策层：第一阶段定种植面积 x，第二阶段按实现降雨调整补种策略 y(s)" , cites: [1, 4] },
  { t: "\n\n③ 目标层：以「期望收益最大化」为主目标、「CVaR 风险」为约束构建双目标，用 ε-约束法绘制帕累托前沿供决策者权衡", cites: [2] },
  { t: "\n\n④ 参数层：存活率等小样本参数用贝叶斯共轭先验估计，比 MLE 更稳健", cites: [3] },
  { t: "\n\n💡 该思路可直接加载到建模智能体，作为 Q2 的选型依据。" , cites: [] },
];

const aiTextEl = document.getElementById("aiText");
let segIdx = 0, charIdx = 0;

function typeLoop() {
  if (segIdx >= ANSWER.length) {
    aiTextEl.classList.remove("stream-caret");
    // 追加来源卡片
    const card = document.createElement("div");
    card.className = "cite-card";
    card.innerHTML =
      '<span style="width:100%;color:var(--muted);font-size:11.5px;letter-spacing:1px;margin-bottom:2px;">📎 引用来源</span>' +
      CHUNKS.slice(0, 3).map(c =>
        `<span class="src-chip" onclick="litChunk(${c.no})"><i></i>[${c.no}] ${c.src}</span>`).join("");
    document.getElementById("aiBubble").appendChild(card);
    return;
  }
  const seg = ANSWER[segIdx];
  if (charIdx === 0 && seg.cites.length) {
    seg.cites.forEach(no => {
      aiTextEl.insertAdjacentHTML("beforeend",
        `<sup><span class="cite" onmouseenter="litChunk(${no})" onmouseleave="unlit(${no})">${no}</span></sup>`);
    });
  }
  const txtNode = document.createTextNode(seg.t[charIdx]);
  aiTextEl.appendChild(txtNode);
  charIdx++;
  if (charIdx >= seg.t.length) { segIdx++; charIdx = 0; }
  // 自动滚到底部
  const msgs = document.getElementById("msgs");
  msgs.scrollTop = msgs.scrollHeight;
  setTimeout(typeLoop, seg.t[charIdx - 1] === "\n" ? 60 : 18);
}
// 延迟启动，营造“检索中”节奏
setTimeout(typeLoop, 900);

/* 引用 ↔ 片段联动高亮 */
function litChunk(no) {
  document.querySelector(`.chunk[data-no="${no}"]`)?.classList.add("lit");
  document.querySelectorAll(`.cite`).forEach(el => {
    if (el.textContent.trim() === String(no)) el.classList.add("lit");
  });
  document.querySelector(`.chunk[data-no="${no}"]`)?.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function unlit(no) {
  document.querySelector(`.chunk[data-no="${no}"]`)?.classList.remove("lit");
  document.querySelectorAll(`.cite`).forEach(el => {
    if (el.textContent.trim() === String(no)) el.classList.remove("lit");
  });
}
</script>
</body>
</html>
